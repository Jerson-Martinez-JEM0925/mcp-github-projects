# Release
# On a vX.Y.Z tag: verify the tag matches core/version.py and a CHANGELOG
# section, run the test suite in the image, build linux/amd64 + linux/arm64,
# push ghcr.io/<owner>/mcp-github-projects (X.Y.Z, X.Y, latest) and publish
# the GitHub release with the CHANGELOG section as notes. See docs/RELEASING.md.
name: Release
run-name: 'Release ${{ github.ref_name }}'

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, push and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Verify tag, code version and CHANGELOG
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Test the tagged tree
        run: |
          DOCKER_BUILDKIT=0 docker build --build-arg INSTALL_TEST_DEPS=true -t github-project-mcp:release-test .
          docker run --rm github-project-mcp:release-test python3 -m pytest tests/ -q --tb=short --ignore=tests/test_contracts.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mcp-github-projects
            org.opencontainers.image.description=MCP server for GitHub Projects V2, issues and CI

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --verify-tag
