[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs", "profiles", ".git"]

[tool.ruff.lint]
# Baseline rules that catch correctness defects without imposing a broad style
# migration in the same hardening PR. Expand incrementally in follow-up PRs.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
strict_optional = true
show_error_codes = true
