---
# Pull-request validation: conventional-commit PR title, YAML lint,
# shell lint, and branch-name convention. The title validator accepts the
# standard Conventional Commit types plus repository-friendly dependency,
# security, release, and hotfix categories.
name: PR Checks
run-name: 'PR #${{ github.event.pull_request.number }} — Checks'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Lint PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps|security|release|hotfix)(\([^()]+\))?!?: .+'
          if [[ "$TITLE" =~ $PATTERN ]]; then
            echo "✅ PR title is valid: $TITLE"
          else
            echo "❌ Invalid PR title: $TITLE"
            echo "Expected: <type>(<optional-scope>): <description>"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, deps, security, release, hotfix"
            exit 1
          fi

  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        run: |
          pipx install yamllint || pip install --user yamllint
          yamllint -c .yamllint.yml .

  lint-shell:
    name: Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          find . -type f -name '*.sh' \
            -not -path './.git/*' -not -path './node_modules/*' \
            -exec shellcheck {} +

  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|docs|chore|refactor|test|ci|perf|build|revert)/([a-z0-9]+(-[a-z0-9]+)*)$'
          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "✅ Branch name '$BRANCH' is valid."
          else
            echo "❌ Invalid branch name: '$BRANCH'"
            echo "Expected format: <type>/<description>"
            echo "Allowed types: feat, fix, docs, chore, refactor, test, ci, perf, build, revert"
            echo "Example: feat/add-milestone-tool"
            exit 1
          fi
