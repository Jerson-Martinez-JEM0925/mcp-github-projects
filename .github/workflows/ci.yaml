# CI
# Main continuous-integration pipeline for the GitHub Project MCP server.
# Builds the Docker image once, then runs syntax, tests, tool-count regression,
# and secret scanning against it.
name: CI
run-name: 'CI — ${{ github.ref_name }}'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: github-project-mcp:ci
  DOCKER_BUILDKIT: '1'

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Export image artifact
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-image
          path: image.tar.gz
          retention-days: 1

  syntax:
    name: Python Syntax
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mcp-image
      - name: Load image
        run: docker load < image.tar.gz
      - name: Check Python syntax
        run: docker run --rm "$IMAGE" python3 scripts/check_syntax.py

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build --build-arg INSTALL_TEST_DEPS=true -t github-project-mcp:test .
      - name: Run unit and contract tests
        run: docker run --rm github-project-mcp:test python3 -m pytest tests/ -v --tb=short

  quality:
    name: Lint, Types and Dependency Security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build test image
        run: docker build --build-arg INSTALL_TEST_DEPS=true -t github-project-mcp:test .
      - name: Run Ruff correctness lint
        run: docker run --rm github-project-mcp:test ruff check --no-cache .
      - name: Type-check hardened core and clients
        run: >-
          docker run --rm github-project-mcp:test mypy --no-incremental
          clients/graphql_client.py clients/rest_client.py clients/resource_cache.py
          clients/gh_cli_client.py core/config.py core/http_auth.py core/observability.py
          core/context.py core/metrics.py core/circuit_breaker.py
      - name: Run Bandit security scan
        run: docker run --rm github-project-mcp:test bandit -r . -x ./tests,./docs,./profiles -ll -ii
      - name: Audit Python dependencies
        run: docker run --rm github-project-mcp:test pip-audit --progress-spinner off

  image-security:
    name: Container Image Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mcp-image
      - name: Load image
        run: docker load < image.tar.gz
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  tools:
    name: Tool-Count Regression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mcp-image
      - name: Load image
        run: docker load < image.tar.gz
      - name: Count registered tools
        run: docker run --rm "$IMAGE" python3 scripts/count_tools.py

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source tree for leaked credentials
        run: bash scripts/scan_secrets.sh
