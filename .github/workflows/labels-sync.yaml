---
# Labels Sync
# Reconciles repository labels with the declarative set in .github/labels.yml.
# Runs on changes to the label file (via push to main) and on demand.
name: Labels Sync
run-name: 'Labels Sync — ${{ github.ref_name }}'

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labels-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply labels from .github/labels.yml
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: false
