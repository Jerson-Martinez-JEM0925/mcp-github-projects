---
# Release
# On a vX.Y.Z tag — pushed manually or created by a workflow_dispatch run —
# verify the tag matches core/version.py and a CHANGELOG section, run the
# test suite in the image, build linux/amd64 + linux/arm64, push
# ghcr.io/<owner>/mcp-github-projects (X.Y.Z, X.Y, latest) with SBOM and
# provenance attestations, then publish the GitHub release with the CHANGELOG
# section as notes. See docs/RELEASING.md.
#
# On-demand path: Actions → Release → Run workflow with tag=vX.Y.Z (and an
# optional ref, default main). The run creates and pushes the tag itself
# when missing; GITHUB_TOKEN pushes do not retrigger this workflow, so the
# release is built once, inside the dispatch run.
name: Release
run-name: 'Release ${{ inputs.tag || github.ref_name }}'

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.5.0 — created on 'ref' when missing"
        required: true
        type: string
      ref:
        description: "Commit/branch the new tag points at"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, push and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # create/push the tag + the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve and create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::tag must look like v1.5.0, got '$tag'"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists — rebuilding and republishing it."
            else
              git tag -a "$tag" -m "$tag"
              git push origin "refs/tags/$tag"
              echo "Created tag $tag on $GITHUB_SHA."
            fi
          else
            tag="$REF_NAME"
          fi
          version="${tag#v}"
          {
            echo "RELEASE_TAG=$tag"
            echo "IMAGE_VERSION=$version"
            echo "IMAGE_MAJOR_MINOR=${version%.*}"
          } >> "$GITHUB_ENV"

      - name: Check out release tag
        run: |
          set -euo pipefail
          # The tag already exists locally when this run created it; fetch it
          # when a dispatch was asked to re-release an existing remote tag.
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" || true
          git checkout "$RELEASE_TAG"

      - name: Verify tag, code version and CHANGELOG
        run: python3 scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Test the tagged tree
        run: |
          DOCKER_BUILDKIT=0 docker build --build-arg INSTALL_TEST_DEPS=true -t github-project-mcp:release-test .
          docker run --rm github-project-mcp:release-test python3 -m pytest tests/ -q --tb=short --ignore=tests/test_contracts.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Raw tags: semver expressions only fire on tag refs, so compute
          # X.Y.Z / X.Y / latest from the resolved release tag — this keeps
          # the tag-push and workflow_dispatch paths identical.
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=${{ env.IMAGE_MAJOR_MINOR }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mcp-github-projects
            org.opencontainers.image.description=MCP server for GitHub Projects V2, issues and CI

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG"
          --title "$RELEASE_TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --verify-tag
